<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>High-Res UI/UX Composer</title>
<style>
  body { background: #000; color: #fff; font-family: monospace; padding: 20px; }
  canvas { border: 1px solid #444; margin-bottom: 20px; display: block; max-width: 100%; }
</style>
</head>
<body>
  <h1>Composer &amp; Segment Inspector</h1>
  <div id="status">Loading...</div>
  <canvas id="cEatoggy" width="2400" height="1350"></canvas>
  <canvas id="cNorozz" width="2400" height="1350"></canvas>
  <canvas id="cGoindiacab" width="1920" height="1080"></canvas>
  <canvas id="cNobrokery" width="1920" height="1080"></canvas>

<script>
function drawPhoneFrame(ctx, x, y, width, height, screenCanvasOrImg, sx, sy, sw, sh, isFeatured = false, glowColor = 'rgba(217, 250, 98, 0.35)') {
  ctx.save();
  ctx.translate(x, y);

  const radius = 48;
  const bezel = 14;

  // Phone outer shadow
  ctx.shadowColor = 'rgba(0, 0, 0, 0.85)';
  ctx.shadowBlur = isFeatured ? 72 : 48;
  ctx.shadowOffsetY = isFeatured ? 32 : 20;

  // Phone body
  ctx.fillStyle = '#0a0d0c';
  ctx.beginPath();
  ctx.roundRect(-width / 2, -height / 2, width, height, radius);
  ctx.fill();

  ctx.shadowColor = 'transparent';
  ctx.shadowBlur = 0;

  // Outer rim stroke
  ctx.strokeStyle = isFeatured ? glowColor : 'rgba(255, 255, 255, 0.16)';
  ctx.lineWidth = isFeatured ? 2.5 : 1.5;
  ctx.stroke();

  // Screen clipping
  ctx.save();
  ctx.beginPath();
  const screenRadius = radius - 8;
  ctx.roundRect(-width / 2 + bezel, -height / 2 + bezel, width - bezel * 2, height - bezel * 2, screenRadius);
  ctx.clip();

  // Draw screen
  ctx.imageSmoothingEnabled = true;
  ctx.imageSmoothingQuality = 'high';
  ctx.drawImage(screenCanvasOrImg, sx, sy, sw, sh, -width / 2 + bezel, -height / 2 + bezel, width - bezel * 2, height - bezel * 2);

  // Screen glass highlight reflection
  const grad = ctx.createLinearGradient(-width / 2, -height / 2, width / 2, height / 2);
  grad.addColorStop(0, 'rgba(255, 255, 255, 0.09)');
  grad.addColorStop(0.3, 'rgba(255, 255, 255, 0.02)');
  grad.addColorStop(0.5, 'transparent');
  ctx.fillStyle = grad;
  ctx.fill();

  ctx.restore();

  // Dynamic Island / Speaker Pill
  ctx.fillStyle = '#060807';
  ctx.beginPath();
  ctx.roundRect(-48, -height / 2 + bezel + 8, 96, 20, 10);
  ctx.fill();
  ctx.strokeStyle = 'rgba(255, 255, 255, 0.12)';
  ctx.lineWidth = 1;
  ctx.stroke();

  ctx.restore();
}

async function loadImage(url) {
  const img = new Image();
  img.crossOrigin = 'anonymous';
  img.src = url;
  await new Promise((res, rej) => {
    img.onload = res;
    img.onerror = rej;
  });
  return img;
}

async function run() {
  const statusEl = document.getElementById('status');
  try {
    statusEl.textContent = 'Loading images...';
    const [eatImg, norImg, goImg, nobImg] = await Promise.all([
      loadImage('/assets/eatoggy_1200.webp'),
      loadImage('/assets/norozz_1200.webp'),
      loadImage('/assets/goindiacab_1920.png'),
      loadImage('/assets/nobrokery_1920.png')
    ]);

    statusEl.textContent = 'Analyzing Eatoggy...';

    // 1. EATOGGY COMPOSITION (2400x1350)
    // eatImg is 9231x1200.
    // Let's find screens:
    // Screen 1: Splash screen around x=495 to 895 (sw=400, sh=895)
    // Screen 2: Food Menu / Ordering around x=975 to 1410 (sw=435, sh=895)
    // Screen 3: Live Map Tracking around x=8750 to 9180 (sw=430, sh=920)
    // Let's scan Eatoggy columns:
    const scanCanvas = document.createElement('canvas');
    scanCanvas.width = eatImg.width;
    scanCanvas.height = eatImg.height;
    const sCtx = scanCanvas.getContext('2d');
    sCtx.drawImage(eatImg, 0, 0);
    const data = sCtx.getImageData(0, 0, eatImg.width, eatImg.height).data;

    const colCounts = [];
    for (let x = 0; x < eatImg.width; x += 2) {
      let count = 0;
      for (let y = 0; y < eatImg.height; y += 4) {
        const idx = (y * eatImg.width + x) * 4;
        if (data[idx + 3] > 30 && (data[idx] > 30 || data[idx+1] > 30 || data[idx+2] > 30)) {
          count++;
        }
      }
      colCounts.push({ x, count });
    }

    const segments = [];
    let inSeg = false;
    let sX = 0;
    for (const c of colCounts) {
      if (c.count > 15) {
        if (!inSeg) { inSeg = true; sX = c.x; }
      } else {
        if (inSeg) {
          inSeg = false;
          if (c.x - sX > 150) segments.push({ startX: sX, endX: c.x, width: c.x - sX });
        }
      }
    }
    if (inSeg) segments.push({ startX: sX, endX: eatImg.width, width: eatImg.width - sX });

    console.log('Eatoggy segments:', segments);

    // Pick 3 best screens:
    // Segment 1 is splash (gold EATOGGY logo)
    // Segment 2 is menu / items
    // Last segment is map
    const segSplash = segments[1] || segments[0];
    const segMenu = segments[2] || segments[1];
    const segMap = segments[segments.length - 1];

    console.log('Using segments:', { segSplash, segMenu, segMap });

    const c1 = document.getElementById('cEatoggy');
    const ctx1 = c1.getContext('2d');
    ctx1.fillStyle = '#0b0e0d';
    ctx1.fillRect(0, 0, 2400, 1350);

    // Radial atmospheric glow
    const g1 = ctx1.createRadialGradient(1200, 720, 100, 1200, 720, 1050);
    g1.addColorStop(0, 'rgba(217, 250, 98, 0.09)');
    g1.addColorStop(0.5, 'rgba(217, 250, 98, 0.025)');
    g1.addColorStop(1, 'transparent');
    ctx1.fillStyle = g1;
    ctx1.fillRect(0, 0, 2400, 1350);

    // Background fine grid
    ctx1.strokeStyle = 'rgba(255, 255, 255, 0.035)';
    ctx1.lineWidth = 1.5;
    for (let x = 80; x < 2400; x += 100) {
      ctx1.beginPath(); ctx1.moveTo(x, 0); ctx1.lineTo(x, 1350); ctx1.stroke();
    }
    for (let y = 80; y < 1350; y += 100) {
      ctx1.beginPath(); ctx1.moveTo(0, y); ctx1.lineTo(2400, y); ctx1.stroke();
    }

    // Draw 3 phones:
    // Left: Splash
    drawPhoneFrame(ctx1, 620, 720, 480, 980, eatImg, segSplash.startX, 0, segSplash.width, 920, false);
    // Right: Map
    drawPhoneFrame(ctx1, 1780, 720, 480, 980, eatImg, segMap.startX, 0, segMap.width, 920, false);
    // Center: Menu (Featured, larger)
    drawPhoneFrame(ctx1, 1200, 680, 520, 1050, eatImg, segMenu.startX, 0, segMenu.width, 920, true, 'rgba(217, 250, 98, 0.5)');


    // 2. NOROZZ COMPOSITION (2400x1350)
    // norImg is 1693x1200.
    // In norImg:
    // Screen 1: Splash screen at top left: x: 252*1693/634 = ~670, y: 52*1200/450 = ~138, w: ~180, h: ~390
    // Screen 2: Dashboard at x: 501*1693/634 = ~1338, y: ~138, w: ~180, h: ~390
    // Screen 3: Map at row 3: x: 338*1693/634 = ~902, y: ~680, w: ~180, h: ~390
    const c2 = document.getElementById('cNorozz');
    const ctx2 = c2.getContext('2d');
    ctx2.fillStyle = '#0b0e0d';
    ctx2.fillRect(0, 0, 2400, 1350);

    const g2 = ctx2.createRadialGradient(1200, 720, 100, 1200, 720, 1050);
    g2.addColorStop(0, 'rgba(118, 201, 180, 0.09)');
    g2.addColorStop(0.5, 'rgba(118, 201, 180, 0.025)');
    g2.addColorStop(1, 'transparent');
    ctx2.fillStyle = g2;
    ctx2.fillRect(0, 0, 2400, 1350);

    ctx2.strokeStyle = 'rgba(255, 255, 255, 0.035)';
    ctx2.lineWidth = 1.5;
    for (let x = 80; x < 2400; x += 100) {
      ctx2.beginPath(); ctx2.moveTo(x, 0); ctx2.lineTo(x, 1350); ctx2.stroke();
    }
    for (let y = 80; y < 1350; y += 100) {
      ctx2.beginPath(); ctx2.moveTo(0, y); ctx2.lineTo(2400, y); ctx2.stroke();
    }

    // Norozz Coordinates from 1693x1200:
    // Splash screen (Green Norozz):
    // Let's compute scale: 1693 / 634 = 2.67; 1200 / 450 = 2.67
    const nScale = 1693 / 634;
    const nx1 = Math.round(252 * nScale), ny1 = Math.round(52 * nScale), nw1 = Math.round(68 * nScale), nh1 = Math.round(146 * nScale);
    const nx2 = Math.round(501 * nScale), ny2 = Math.round(52 * nScale), nw2 = Math.round(68 * nScale), nh2 = Math.round(146 * nScale);
    const nx3 = Math.round(338 * nScale), ny3 = Math.round(256 * nScale), nw3 = Math.round(68 * nScale), nh3 = Math.round(146 * nScale);

    drawPhoneFrame(ctx2, 620, 720, 480, 980, norImg, nx1, ny1, nw1, nh1, false);
    drawPhoneFrame(ctx2, 1780, 720, 480, 980, norImg, nx3, ny3, nw3, nh3, false);
    drawPhoneFrame(ctx2, 1200, 680, 520, 1050, norImg, nx2, ny2, nw2, nh2, true, 'rgba(118, 201, 180, 0.5)');


    // 3. GOINDIACAB (1920x1080)
    // Crop top bar (y: 45 to 980)
    const c3 = document.getElementById('cGoindiacab');
    const ctx3 = c3.getContext('2d');
    ctx3.fillStyle = '#0a0d0c';
    ctx3.fillRect(0, 0, 1920, 1080);
    // Draw cropped high-res interface
    // Source: x: 0, y: 44, w: 1920, h: 936
    ctx3.drawImage(goImg, 0, 44, 1920, 936, 0, 0, 1920, 1080);


    // 4. NOBROKERY (1920x1080)
    // In nobImg:
    // Top banner is y: 0 to 92. Bottom cookie banner is y: 990 to 1080.
    // High-res interface is x: 0, y: 92, w: 1920, h: 898
    const c4 = document.getElementById('cNobrokery');
    const ctx4 = c4.getContext('2d');
    ctx4.fillStyle = '#0a0d0c';
    ctx4.fillRect(0, 0, 1920, 1080);
    ctx4.drawImage(nobImg, 0, 92, 1920, 898, 0, 0, 1920, 1080);

    statusEl.textContent = 'READY';
    window.__COMPOSITION_READY__ = true;
    console.log('All canvases rendered successfully at full resolution!');
  } catch(err) {
    statusEl.textContent = 'Error: ' + err.message;
    console.error(err);
  }
}
run();
</script>
</body>
</html>
